included:
  - Sources
  - Tests
  - Example/AnimationBGViewExample
  - Example/AnimationBGViewExampleUITests

excluded:
  - Reference
  - .build

opt_in_rules:
  - force_unwrapping
  - explicit_init
  - first_where
  - sorted_first_last
  - closure_spacing
  - empty_count
  - fatal_error_message
  - contains_over_filter_count
  - discouraged_optional_boolean

disabled_rules:
  - todo # Reported as an error below instead; no TODOs may ship.

custom_rules:
  no_todo_markers:
    name: "No unfinished work"
    regex: '(TODO|FIXME)\s*:'
    message: "Do not ship unfinished work."
    severity: error

identifier_name:
  excluded: [x, y, u, v, id, dx, dy, lhs, rhs]
cyclomatic_complexity:
  ignores_case_statements: true
line_length:
  warning: 140
  ignores_comments: false
  ignores_urls: true
type_body_length:
  warning: 300
file_length:
  warning: 500
function_body_length:
  warning: 45
large_tuple:
  warning: 3
