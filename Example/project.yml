# Generates AnimationBGViewExample.xcodeproj. The generated project is committed, so XcodeGen is
# only needed after changing this file: `cd Example && xcodegen generate`.
name: AnimationBGViewExample
options:
  bundleIdPrefix: com.example
  createIntermediateGroups: true
  deploymentTarget:
    iOS: "17.0"
packages:
  AnimationBGView:
    path: ..
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    GENERATE_INFOPLIST_FILE: YES
    CURRENT_PROJECT_VERSION: 1
    MARKETING_VERSION: 1.0.0
    # Sign to run locally, so the app runs on a simulator without a development team.
    # To run on a physical device, choose a team under Signing & Capabilities.
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
targets:
  AnimationBGViewExample:
    type: application
    supportedDestinations: [iOS]
    sources:
      - path: AnimationBGViewExample
    dependencies:
      - package: AnimationBGView
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AnimationBGViewExample
        # Set per target because XcodeGen's platform preset would otherwise override it.
        CODE_SIGN_IDENTITY: "-"
        PRODUCT_NAME: AnimationBGViewExample
        INFOPLIST_KEY_CFBundleDisplayName: AnimationBGView
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_PREVIEWS: YES
        TARGETED_DEVICE_FAMILY: "1,2"
        INFOPLIST_KEY_UIApplicationSceneManifest_Generation: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
  AnimationBGViewExampleUITests:
    type: bundle.ui-testing
    supportedDestinations: [iOS]
    sources:
      - path: AnimationBGViewExampleUITests
    dependencies:
      - target: AnimationBGViewExample
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.example.AnimationBGViewExampleUITests
        CODE_SIGN_IDENTITY: "-"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  AnimationBGViewExample:
    build:
      targets:
        AnimationBGViewExample: all
        AnimationBGViewExampleUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets:
        - AnimationBGViewExampleUITests
